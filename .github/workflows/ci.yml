name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint with ruff
        run: |
          pip install ruff
          ruff check src/ tests/

      - name: Run tests
        env:
          APP_ENV: test
          ENABLE_LIVE_ACTIONS: "false"
        run: |
          pytest tests/ -v --tb=short
          coverage xml

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

  docker:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t ai-autopilot:latest .

      - name: Test Docker image starts
        run: |
          trap 'docker logs test-container; docker rm -f test-container' EXIT
          docker run -d --name test-container \
            -e APP_ENV=test \
            -e ENABLE_LIVE_ACTIONS=false \
            -p 8000:8000 \
            ai-autopilot:latest
          curl --fail --retry 20 --retry-delay 1 --retry-connrefused http://localhost:8000/health
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8000/api/status)" = "401"
